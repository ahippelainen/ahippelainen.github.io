# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
# Pages source must be "GitHub Actions" in the repo settings. Actions are pinned to commit SHAs;
# Dependabot (.github/dependabot.yml) proposes updates. On a Hugo upgrade, change HUGO_VERSION and
# HUGO_SHA256 (from hugo_<version>_checksums.txt on the release page) together.
name: Deploy hippe.fi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      HUGO_SHA256: 0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Hugo
        run: |
          f="${RUNNER_TEMP}/hugo.tar.gz"
          curl -sfL -o "$f" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  $f" | sha256sum -c -
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "$f"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      # base_url is the custom domain once one is configured, otherwise the github.io URL,
      # so the site can be checked on github.io before DNS is touched.
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${BASE_URL}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
