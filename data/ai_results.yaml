- title: Algebraicity of Weil classes on non-split abelian sixfolds of Weil type over Q(√−3) with Hermitian determinant −2
  date: 2026-10-18
  area: Algebraic geometry
  summary: >
    Claims that every Weil class is algebraic on every complex abelian sixfold of Weil type over Q(√−3) whose Hermitian form has signature (3,3) and determinant −2, a non-split case that the results on split sixfolds do not reach. The sixfolds are modelled by covers of the projective line with group the complex reflection group G₃₂, whose period map is shown to dominate their moduli space with a ball-arithmetic certificate, and the Weil classes are reduced to those of eleven cyclic subcovers. 
  note: /research/ai-driven/weil_nonsplit.pdf
  companion: /research/ai-driven/weil_nonsplit_explained.pdf
  code: https://github.com/ahippelainen/weil-nonsplit-abelian-sixfolds-public
  hexagon: https://hexagonmath.org/2610.00371v1

- title: On the irrationality of the 3-adic zeta value ζ₃(5)
  date: 2026-10-04
  area: Number theory
  summary: >
    Claims that ζ₃(5) is irrational, adapting to p = 3 a recent 2-adic argument that was itself built on Fauzan's proof for ζ(5), with a second, independent proof via overconvergent modular forms in an appendix.
  note: /research/ai-driven/zeta3_5.pdf
  companion: /research/ai-driven/zeta3_5_explained.pdf
  code: https://github.com/ahippelainen/zeta-3-5-irrational-public
  post: /blog/zeta3-5-is-irrational-maybe/
